[package]
name = "moby-desktop"
version = "0.1.0"
description = "The Windows desktop companion for the Moby robot"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[lib]
name = "moby_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
