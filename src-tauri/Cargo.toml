[package]
name = "moby-desktop"
version = "0.1.0"
description = "The Windows desktop companion for the Moby robot"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[lib]
name = "moby_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
# In-process git status for git_status. Pinned exactly and with only the status features: see docs/adr/0004-git-status.md.
gix = { version = "=0.90.0", default-features = false, features = ["status", "revision", "sha1"] }
keyring = "4.2.0"
# Temporary sibling checkout, as in docs/adr/0001-desktop-foundation.md. Becomes a git tag after the first protocol release.
moby-protocol = { path = "../../moby-protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }
# Native file dialogs, opened from Rust only. The webview gets no dialog or filesystem plugin.
rfd = { version = "0.17.2", default-features = false }
# Pinned exactly: the bundled SQLite is part of the local-data trust base (see docs/adr/0003-local-store.md).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2"
time = { version = "0.3.55", default-features = false, features = ["std", "parsing"] }
tokio = { version = "1", default-features = false, features = ["time", "sync", "macros", "rt"] }
# MessageBoxW and its window lookup, for the native confirmation (src/native.rs).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
uuid = { version = "1.29.0", default-features = false, features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
