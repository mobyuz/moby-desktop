name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: moby-desktop
          persist-credentials: false
      # The protocol and face packages are not published yet, so build each from a pinned
      # commit next to this checkout. All Moby repositories are public (owner decision), so
      # no token is needed. Replace the pins with released @mobyuz/moby-protocol and
      # @mobyuz/moby-ui versions once they exist (docs/adr/0001-desktop-foundation.md,
      # docs/adr/0008-moby-ui.md).
      # Protocol 0.2.0 with two-way proof (mobyuz/moby-protocol PR #5, not yet on main).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mobyuz/moby-protocol
          ref: 0ddc9a9befddb59082ec35e354512b3d72129fcf
          path: moby-protocol
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mobyuz/moby-ui
          ref: 62de4e31ea598205dcc07bcbedb775ce0820a5ab
          path: moby-ui
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: moby-desktop/.node-version
      - run: npm install --global npm@11.6.2
      - name: Build moby-protocol
        working-directory: moby-protocol
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build moby-ui
        working-directory: moby-ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Install dependencies
        working-directory: moby-desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend checks
        working-directory: moby-desktop
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Rust checks
        working-directory: moby-desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the Windows app
        working-directory: moby-desktop
        run: npm run tauri -- build --bundles nsis
      - name: Release binary has no simulator and no PC microphone
        working-directory: moby-desktop
        shell: pwsh
        run: ./scripts/check-release-excludes-dev.ps1 src-tauri/target/release/moby-desktop.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moby-windows-installer
          path: moby-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
